<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cazador de Monedas - Juego VR 3D</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  body { margin: 0; font-family: Arial, sans-serif; overflow: hidden; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 999;
    color: white; background: rgba(0,0,0,0.6); padding: 10px 16px;
    border-radius: 10px; font-size: 18px;
  }
  #instructions {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    z-index: 999; color: white; background: rgba(0,0,0,0.6);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; text-align: center;
  }
  #winMsg {
    position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
    z-index: 1000; color: #fff; background: rgba(0,150,50,0.9);
    padding: 30px 50px; border-radius: 16px; font-size: 32px; display: none;
    text-align: center;
  }
</style>
</head>
<body>

<div id="hud">🪙 Monedas: <span id="coinCount">0</span> / <span id="coinTotal">6</span></div>
<div id="instructions">
  PC: mueve el ratón para mirar y haz clic en las monedas<br>
  VR: mira una moneda fijamente unos segundos, o usa el gatillo del control
</div>
<div id="winMsg">¡Completado! 🎉<br>Recogiste todas las monedas</div>

<a-scene background="color: #7EC0EE" fog="type: linear; color: #7EC0EE; near: 20; far: 60">

  <!-- Iluminación -->
  <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
  <a-light type="directional" color="#ffffff" intensity="0.6" position="5 10 5"></a-light>

  <!-- Cielo y suelo -->
  <a-sky color="#7EC0EE"></a-sky>
  <a-plane rotation="-90 0 0" width="100" height="100" color="#3FA34D"></a-plane>

  <!-- Cámara con cursor de mirada: funciona igual en PC (clic) y en VR (mirar/gatillo) -->
  <a-entity position="0 1.6 0">
    <a-camera look-controls wasd-controls>
      <a-cursor
        fuse="true"
        fuse-timeout="1500"
        color="#FFFFFF"
        raycaster="objects: .coin">
      </a-cursor>
    </a-camera>
  </a-entity>

  <!-- Monedas coleccionables repartidas por el escenario -->
  <a-cylinder class="coin" position="0 1.2 -5" radius="0.4" height="0.1" color="#FFD700"
    rotation="90 0 0" animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear"></a-cylinder>

  <a-cylinder class="coin" position="4 1.2 -8" radius="0.4" height="0.1" color="#FFD700"
    rotation="90 0 0" animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear"></a-cylinder>

  <a-cylinder class="coin" position="-4 1.2 -8" radius="0.4" height="0.1" color="#FFD700"
    rotation="90 0 0" animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear"></a-cylinder>

  <a-cylinder class="coin" position="6 1.2 -3" radius="0.4" height="0.1" color="#FFD700"
    rotation="90 0 0" animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear"></a-cylinder>

  <a-cylinder class="coin" position="-6 1.2 -3" radius="0.4" height="0.1" color="#FFD700"
    rotation="90 0 0" animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear"></a-cylinder>

  <a-cylinder class="coin" position="0 1.2 -12" radius="0.4" height="0.1" color="#FFD700"
    rotation="90 0 0" animation="property: rotation; to: 90 360 0; loop: true; dur: 2000; easing: linear"></a-cylinder>

  <!-- Decoración: árboles simples -->
  <a-entity position="8 0 -10">
    <a-cylinder radius="0.3" height="2" color="#8B5A2B" position="0 1 0"></a-cylinder>
    <a-sphere radius="1.3" color="#2E8B57" position="0 2.5 0"></a-sphere>
  </a-entity>
  <a-entity position="-8 0 -10">
    <a-cylinder radius="0.3" height="2" color="#8B5A2B" position="0 1 0"></a-cylinder>
    <a-sphere radius="1.3" color="#2E8B57" position="0 2.5 0"></a-sphere>
  </a-entity>
  <a-entity position="10 0 -3">
    <a-cylinder radius="0.3" height="2" color="#8B5A2B" position="0 1 0"></a-cylinder>
    <a-sphere radius="1.3" color="#2E8B57" position="0 2.5 0"></a-sphere>
  </a-entity>

</a-scene>

<script>
  let collected = 0;
  const coins = document.querySelectorAll('.coin');
  document.getElementById('coinTotal').textContent = coins.length;

  coins.forEach(coin => {
    coin.addEventListener('click', function () {
      if (coin.dataset.collected) return;
      coin.dataset.collected = "true";
      coin.setAttribute('visible', false);
      collected++;
      document.getElementById('coinCount').textContent = collected;
      if (collected === coins.length) {
        document.getElementById('winMsg').style.display = 'block';
      }
    });
  });
</script>

</body>
</html>
