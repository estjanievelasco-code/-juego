<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minijuego VR de Terror - Pasillo Sombrío</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 14px;
            z-index: 10;
        }
    </style>

    <!-- Import Map para cargar Three.js y sus módulos desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="info">
        <b>Experiencia VR de Terror</b><br>
        Encuentra la llave dorada en el pasillo...<br>
        <i>Requiere visor compatible con WebXR (Meta Quest, Chrome VR, etc.)</i>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        // --- 1. CONFIGURACIÓN BÁSICA DE LA ESCENA ---
        const scene = new THREE.Scene();
        // Niebla densa y negra para ocultar los límites del pasillo y crear atmósfera
        scene.fog = new THREE.FogExp2(0x000000, 0.15);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        
        // Grupo para el jugador (permite mover la cámara y la linterna juntas en VR)
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 8); // Posición inicial
        playerGroup.add(camera);
        scene.add(playerGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Habilitar sombras y mapeo de tonos para mayor realismo y rendimiento
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        
        // --- CONFIGURACIÓN WEBXR ---
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        // Añade el botón oficial de entrada a VR
        document.body.appendChild(VRButton.createButton(renderer));

        // --- 2. ILUMINACIÓN ---
        // Luz ambiental muy reducida
        const ambientLight = new THREE.AmbientLight(0x050508, 0.2);
        scene.add(ambientLight);

        // Linterna del jugador (luz focal pegada a la cámara)
        const flashlight = new THREE.SpotLight(0xffffff, 4, 15, Math.PI / 6, 0.5, 1);
        flashlight.castShadow = true;
        camera.add(flashlight);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight.target);

        // Luz tenue y parpadeante en el techo del pasillo
        const hallwayLight = new THREE.PointLight(0xff3300, 1, 8);
        hallwayLight.position.set(0, 2.2, 0);
        scene.add(hallwayLight);

        // --- 3. CONSTRUCCIÓN DEL PASILLO (GEOMETRÍA OPTIMIZADA) ---
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x111113, roughness: 0.9, metalness: 0.1 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.4 });

        // Paredes del pasillo
        const createWall = (w, h, d, x, y, z) => {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, wallMaterial);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
        };

        // Pasillo de 3m de ancho, 3m de alto y 24m de largo
        createWall(0.2, 3, 24, -1.5, 1.5, 0); // Pared izquierda
        createWall(0.2, 3, 24, 1.5, 1.5, 0);  // Pared derecha
        createWall(3, 0.2, 24, 0, 0, 0);      // Suelo
        createWall(3, 0.2, 24, 0, 3, 0);      // Techo
        createWall(3, 3, 0.2, 0, 1.5, -12);   // Pared del fondo

        // --- 4. ELEMENTOS INTERACTIVOS Y ENEMIGO ---
        
        // Objeto interactivo: La Llave
        const keyGroup = new THREE.Group();
        const keyGeo = new THREE.TorusGeometry(0.1, 0.03, 8, 16);
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa8800, roughness: 0.2 });
        const keyMesh = new THREE.Mesh(keyGeo, keyMat);
        keyGroup.add(keyMesh);
        keyGroup.position.set(0, 1.2, -8); // Al fondo del pasillo
        scene.add(keyGroup);

        // Generar "ojos brillantes" al fondo para tensión previa
        const eyesGeo = new THREE.SphereGeometry(0.02, 8, 8);
        const eyesMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const eye1 = new THREE.Mesh(eyesGeo, eyesMat);
        const eye2 = new THREE.Mesh(eyesGeo, eyesMat);
        eye1.position.set(-0.1, 1.6, -11.8);
        eye2.position.set(0.1, 1.6, -11.8);
        scene.add(eye1, eye2);

        // Enemigo (Aparece en el Jumpscare)
        const monsterGroup = new THREE.Group();
        // Cabeza deformada
        const headGeo = new THREE.IcosahedronGeometry(0.4, 1);
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
        const monsterHead = new THREE.Mesh(headGeo, monsterMat);
        monsterHead.position.y = 1.6;
        monsterGroup.add(monsterHead);
        
        // Ojos Rojos del Monstruo
        const mEye1 = new THREE.Mesh(eyesGeo, eyesMat);
        const mEye2 = new THREE.Mesh(eyesGeo, eyesMat);
        mEye1.position.set(-0.1, 1.65, 0.35);
        mEye2.position.set(0.1, 1.65, 0.35);
        monsterGroup.add(mEye1, mEye2);

        monsterGroup.position.set(0, 0, -10);
        monsterGroup.visible = false; // Oculto al inicio
        scene.add(monsterGroup);

        // --- 5. LÓGICA DEL JUEGO Y EVENTOS ---
        const raycaster = new THREE.Raycaster();
        let keyGazeTimer = 0;
        let triggeredJumpscare = false;
        let clock = new THREE.Clock();

        function triggerJumpscare() {
            triggeredJumpscare = true;
            keyGroup.visible = false; // La llave desaparece
            
            // Aparece el monstruo repentinamente frente al jugador
            monsterGroup.position.set(playerGroup.position.x, 0, playerGroup.position.z - 0.8);
            monsterGroup.visible = true;

            // Parpadeo agresivo de luces de color rojo
            hallwayLight.color.setHex(0xff0000);
            hallwayLight.intensity = 10;
            flashlight.intensity = 0; // Se apaga la linterna para mayor impacto

            // Sonido sintético de impacto usando Web Audio API (No requiere archivos externos)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.8);
        }

        // --- 6. BUCLE PRINCIPAL DE RENDIMIENTO (ANIMATE) ---
        // Se usa renderer.setAnimationLoop para garantizar la máxima tasa de FPS en WebXR
        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Animación flotante de la llave
            if (keyGroup.visible) {
                keyGroup.rotation.y += 1 * delta;
                keyGroup.position.y = 1.2 + Math.sin(time * 2) * 0.1;
            }

            // Efecto de parpadeo aleatorio tenue en la luz del pasillo
            if (!triggeredJumpscare) {
                if (Math.random() > 0.93) {
                    hallwayLight.intensity = Math.random() * 2;
                }
            }

            // Detección de mirada (Gaze Interaction): Permite interactuar solo mirando
            if (!triggeredJumpscare) {
                // Lanzamos un rayo desde la cámara en la dirección en la que el usuario mira
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObject(keyMesh);

                // Si mira fijamente a la llave o está muy cerca
                const distanceToKey = playerGroup.position.distanceTo(keyGroup.position);

                if (intersects.length > 0 || distanceToKey < 2.0) {
                    keyGazeTimer += delta;
                    // Cambio sutil visual para dar feedback de interacción
                    keyMat.emissive.setHex(0xff0000); 

                    // Si la mira durante 1.5 segundos o se acerca
                    if (keyGazeTimer > 1.5 || distanceToKey < 1.5) {
                        triggerJumpscare();
                    }
                } else {
                    keyGazeTimer = 0;
                    keyMat.emissive.setHex(0xaa8800);
                }
            } else {
                // Animación convulsiva del monstruo durante el jumpscare
                monsterGroup.position.x = playerGroup.position.x + (Math.random() - 0.5) * 0.05;
                monsterGroup.position.y = (Math.random() - 0.5) * 0.05;
            }

            // Renderizar escena
            renderer.render(scene, camera);
        });

        // Ajuste de ventana en caso de jugar desde el navegador de escritorio
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
